<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FestiQ — Festival Trivia Bingo to Win Real Tickets</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="FestiQ — Festival Trivia Bingo to Win Real Tickets">
<meta property="og:description" content="Play trivia bingo for ACL, Coachella, EDC and dozens more festivals. Clear a line of artist quizzes and win real festival tickets.">
<meta property="og:image" content="/assets/logo-512.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FestiQ — Festival Trivia Bingo to Win Real Tickets">
<meta name="twitter:description" content="Play trivia bingo for ACL, Coachella, EDC and dozens more festivals. Clear a line of artist quizzes and win real festival tickets.">
<meta name="twitter:image" content="/assets/logo-512.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap');

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  :root{
    --bg:      #fff3e6;
    --bg1:     #fffdfa;
    --bg2:     #fdf0ff;
    --border:  rgba(20,10,40,0.1);
    --border2: rgba(20,10,40,0.18);
    --green:   #00c896;
    --red:     #ff2d55;
    --gold:    #ff9d00;
    --blue:    #2f7bff;
    --purple:  #a230ea;
    --pink:    #ff3d81;
    --txt:     #170b28;
    --txt2:    #6a5f85;
    --txt3:    #b3a8c9;
    --mono:    'IBM Plex Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
  }

  html{height:100%;}
  body{
    height:100%;
    background:#fff3e6;
    background-image:
      radial-gradient(circle, rgba(20,10,40,0.05) 1px, transparent 1.4px),
      radial-gradient(ellipse 75% 55% at 8% 0%, rgba(255,61,129,0.30) 0%, transparent 55%),
      radial-gradient(ellipse 65% 50% at 92% 4%, rgba(47,123,255,0.26) 0%, transparent 55%),
      radial-gradient(ellipse 60% 48% at 100% 62%, rgba(255,157,0,0.26) 0%, transparent 55%),
      radial-gradient(ellipse 85% 65% at 26% 104%, rgba(162,48,234,0.26) 0%, transparent 60%),
      radial-gradient(ellipse 55% 42% at 0% 92%, rgba(0,200,150,0.22) 0%, transparent 55%);
    background-size:22px 22px, auto, auto, auto, auto, auto;
    background-attachment:fixed;
    color:var(--txt);
    font-family:var(--mono);
    font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  ::-webkit-scrollbar{width:3px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(200%);}}
  @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .fade-up{animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;}

  .btn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;border:1.5px solid var(--border2);background:var(--bg1);color:var(--txt2);padding:9px 18px;cursor:pointer;transition:all .18s;border-radius:20px;}
  .btn:hover{border-color:var(--txt);color:var(--txt);background:rgba(20,10,40,0.04);transform:translateY(-1px);}
  .btn-green{border-color:var(--green);color:var(--green);box-shadow:0 2px 10px rgba(0,200,150,0.18);}
  .btn-green:hover{background:var(--green);color:#04241c;box-shadow:0 0 20px rgba(0,200,150,0.45);}
  .btn-gold{border-color:var(--gold);color:var(--gold);box-shadow:0 2px 10px rgba(255,157,0,0.2);}
  .btn-gold:hover{background:var(--gold);color:#2b1500;box-shadow:0 0 20px rgba(255,157,0,0.5);}
  .btn-purple{border-color:var(--purple);color:var(--purple);box-shadow:0 2px 10px rgba(162,48,234,0.18);}
  .btn-purple:hover{background:var(--purple);color:#fff;box-shadow:0 0 20px rgba(162,48,234,0.5);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

  input{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--border2);color:var(--txt);padding:9px 13px;outline:none;transition:border-color .15s,box-shadow .15s;border-radius:3px;width:100%;}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,166,255,0.12);}
  input::placeholder{color:var(--txt3);}

  .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border:1px solid;border-radius:20px;}
  .tag-live{color:var(--green);border-color:var(--green);background:rgba(0,255,179,0.08);}
  .tag-won{color:var(--gold);border-color:var(--gold);background:rgba(255,213,79,0.08);}
  .tag-upcoming{color:var(--txt2);border-color:var(--border2);background:rgba(20,10,40,0.04);}

  .header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;position:sticky;top:0;background:rgba(255,250,246,0.9);backdrop-filter:blur(8px);z-index:50;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#ff3d81,#ff9d00,#ffe066,#00e5a0,#2f9bff,#a230ea) 1;}
  .logo,.logo span{
    background:linear-gradient(100deg,#ff3d81 0%,#ff9d00 18%,#ffe066 36%,#00e5a0 54%,#2f9bff 72%,#a230ea 88%,#ff3d81 100%);
    background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:holo 6s linear infinite;}
  .logo{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:0.02em;cursor:pointer;
    filter:drop-shadow(0 0 12px rgba(255,61,129,0.3));}
  @keyframes holo{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px;}
  .wallet-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;background:var(--bg2);border:1px solid var(--border2);padding:7px 14px;border-radius:20px;color:var(--gold);box-shadow:0 2px 8px rgba(255,157,0,0.15);}

  .hero{text-align:center;margin-bottom:28px;}
  .hero .eyebrow{font-size:10px;color:var(--purple);letter-spacing:0.16em;font-weight:800;margin-bottom:10px;text-transform:uppercase;}
  .hero h1{font-family:var(--display);font-size:48px;font-weight:800;line-height:0.98;margin-bottom:10px;text-shadow:0 2px 24px rgba(255,61,129,0.18);}
  .hero p{color:var(--txt2);font-size:13px;max-width:560px;margin:0 auto;line-height:1.6;}

  .card{background:var(--bg1);border:1px solid var(--border2);border-radius:8px;box-shadow:0 1px 3px rgba(20,10,40,0.05);}

  .festival-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:24px;}
  .festival-card{background:var(--bg1);border:1.5px solid var(--fc-accent,var(--border));border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(0.16,1,0.3,1),border-color .15s,box-shadow .22s;box-shadow:0 4px 14px rgba(20,10,40,0.08);position:relative;}
  .festival-card.is-upcoming{opacity:0.82;}
  .festival-card:hover{transform:translateY(-5px) rotate(-0.4deg);box-shadow:0 16px 32px rgba(20,10,40,0.16),0 0 0 2px var(--fc-accent,var(--border2));}
  .festival-banner{height:84px;display:flex;align-items:flex-end;padding:12px 14px;position:relative;}
  .festival-banner::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:1px;background-image:radial-gradient(circle,rgba(255,255,255,0.9) 1.5px,transparent 1.6px);background-size:8px 100%;opacity:0.8;}
  .festival-body{padding:16px 16px 16px;}
  .festival-body h3{font-family:var(--display);font-size:20px;font-weight:700;margin-bottom:4px;}
  .festival-body .meta{font-size:11px;color:var(--txt2);margin-bottom:6px;}

  /* Wallet panel — one unified, festival-poster-styled strip (gradient wash,
     glowing icons, soft dividers) replacing three flat identical boxes. */
  .wallet-panel{display:flex;margin-bottom:20px;border-radius:14px;overflow:hidden;
    background:linear-gradient(120deg, rgba(255,61,129,0.12), rgba(162,48,234,0.12) 50%, rgba(47,123,255,0.12));
    border:1.5px solid var(--border2);box-shadow:0 6px 22px rgba(20,10,40,0.10);position:relative;}
  .wallet-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,#ff3d81,#ff9d00,#ffe066,#00e5a0,#2f9bff,#a230ea);}
  .wp-stat{flex:1;padding:18px 14px 16px;text-align:center;position:relative;}
  .wp-stat:not(:last-child)::after{content:'';position:absolute;right:0;top:22%;bottom:22%;width:1px;background:var(--border2);}
  .wp-icon{font-size:21px;margin-bottom:6px;display:block;filter:drop-shadow(0 0 8px rgba(255,157,0,0.4));}
  .wp-val{font-family:var(--display);font-size:29px;font-weight:800;line-height:1;}
  .wp-lbl{font-size:9px;color:var(--txt2);letter-spacing:0.12em;margin-top:6px;text-transform:uppercase;font-weight:700;}

  /* Shared "poster panel" look for the new Pricing / FAQ / Account pages —
     same warm-card + accent-glow language as the rest of the site. */
  .poster-panel{background:var(--bg1);border:1.5px solid var(--border2);border-radius:12px;padding:22px 22px 24px;margin-bottom:18px;box-shadow:0 4px 16px rgba(20,10,40,0.06);position:relative;overflow:hidden;}
  .poster-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff3d81,#ff9d00,#ffe066,#00e5a0,#2f9bff,#a230ea);}
  .price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px;}
  .price-card{border:1.5px solid var(--pc-accent,var(--border2));border-radius:10px;padding:18px;background:linear-gradient(160deg, var(--pc-tint,var(--bg2)), var(--bg1) 70%);position:relative;}
  .price-card h4{font-family:var(--display);font-size:19px;font-weight:800;margin-bottom:2px;}
  .price-card .pc-meta{font-size:10.5px;color:var(--txt2);margin-bottom:10px;}
  .price-card .pc-price{font-family:var(--display);font-size:26px;font-weight:800;color:var(--pc-accent,var(--gold));line-height:1;}
  .price-card .pc-price small{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--txt2);}
  .price-card .pc-note{font-size:10px;color:var(--txt2);margin-top:8px;}
  .faq-item{border:1px solid var(--border2);border-radius:8px;margin-bottom:10px;overflow:hidden;background:var(--bg1);}
  .faq-q{padding:14px 16px;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;user-select:none;}
  .faq-q:hover{background:var(--bg2);}
  .faq-q .caret{color:var(--purple);transition:transform .2s;flex-shrink:0;}
  .faq-item.open .faq-q .caret{transform:rotate(180deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:12px;color:var(--txt2);line-height:1.6;}
  .faq-item.open .faq-a{max-height:400px;}
  .faq-a-inner{padding:0 16px 16px;}
  .account-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .account-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#ff3d81,#a230ea);box-shadow:0 4px 16px rgba(162,48,234,0.35);flex-shrink:0;}
  .account-board-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--bg2);}
  .account-board-row .ab-swatch{width:8px;align-self:stretch;border-radius:4px;flex-shrink:0;}
  .account-board-row .ab-body{flex:1;min-width:0;}
  .account-board-row .ab-name{font-weight:700;font-size:12.5px;}
  .account-board-row .ab-meta{font-size:10.5px;color:var(--txt2);margin-top:2px;}
  .ticket-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px dashed var(--gold);border-radius:8px;margin-bottom:8px;background:rgba(255,157,0,0.06);flex-wrap:wrap;}
  .nav-links{display:flex;align-items:center;gap:16px;margin-right:4px;}
  .nav-links a{font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--txt2);text-decoration:none;transition:color .15s;}
  .nav-links a:hover{color:var(--pink);}
  @media (max-width:720px){.nav-links{display:none;}}

  .banner-block{margin-bottom:20px;padding:14px 18px;border-radius:6px;font-size:12px;text-align:center;font-weight:700;}
  .banner-green{background:rgba(0,255,179,0.08);border:1px solid var(--green);color:var(--green);}
  .banner-gold{background:rgba(255,213,79,0.1);border:2px solid var(--gold);color:var(--gold);}
  .banner-red{background:rgba(255,51,85,0.08);border:2px solid var(--red);color:var(--red);}

  .board-grid{display:grid;gap:10px;margin-bottom:16px;}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 1px var(--box-accent,var(--border2)),0 0 0 rgba(0,0,0,0);}50%{box-shadow:0 0 0 1px var(--box-accent,var(--border2)),0 0 16px 1px var(--box-glow,rgba(162,48,234,0.18));}}
  @keyframes stampIn{0%{transform:scale(2.2) rotate(-14deg);opacity:0;}60%{transform:scale(0.92) rotate(-4deg);opacity:1;}100%{transform:scale(1) rotate(-8deg);opacity:1;}}
  @keyframes deadShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-3px) rotate(-1deg);}40%{transform:translateX(3px) rotate(1deg);}60%{transform:translateX(-2px);}80%{transform:translateX(2px);}}
  .artist-box{position:relative;aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;cursor:pointer;transition:border-color .15s,transform .15s,opacity .2s,filter .2s,box-shadow .2s;background:linear-gradient(160deg,#fff 0%,var(--box-tint,var(--bg2)) 130%);border:2px solid var(--box-accent,var(--border2));overflow:hidden;animation:cardIn .45s cubic-bezier(0.16,1,0.3,1) both,breathe 2.8s ease-in-out infinite;}
  .artist-box::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--box-accent,var(--purple));opacity:0.9;}
  .artist-box:hover{transform:translateY(-4px) scale(1.04) rotate(-1deg);box-shadow:0 12px 22px rgba(20,10,40,0.16);}
  .artist-box.cleared{background:linear-gradient(160deg,rgba(0,255,179,0.2),rgba(0,255,179,0.05));border-color:var(--green);cursor:default;animation:cardIn .45s cubic-bezier(0.16,1,0.3,1) both;}
  .artist-box.cleared::before{background:var(--green);opacity:1;}
  .artist-box.dead{background:repeating-linear-gradient(135deg,rgba(255,51,85,0.12),rgba(255,51,85,0.12) 6px,rgba(255,51,85,0.04) 6px,rgba(255,51,85,0.04) 12px);border-color:var(--red);cursor:default;animation:cardIn .45s cubic-bezier(0.16,1,0.3,1) both,deadShake .4s ease-in-out 1;filter:grayscale(0.55);}
  .artist-box.dead::before{background:var(--red);opacity:1;}
  .artist-box.inline{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,213,79,0.35)!important;border-color:var(--gold)!important;animation:cardIn .45s cubic-bezier(0.16,1,0.3,1) both;}
  .artist-box.dimmed{opacity:0.3;filter:grayscale(0.7);animation:cardIn .45s cubic-bezier(0.16,1,0.3,1) both;}
  .artist-box.locked{cursor:default!important;filter:grayscale(0.85);opacity:0.62;background:var(--bg2)!important;animation:cardIn .45s cubic-bezier(0.16,1,0.3,1) both!important;}
  .artist-box.locked:hover{transform:none;box-shadow:none;}
  .artist-box.locked .tagline{color:var(--txt2);background:rgba(20,10,40,0.06);}
  .artist-box .logo-badge{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:14px;color:#fff;margin-bottom:5px;background:var(--box-accent,var(--purple));box-shadow:0 3px 8px rgba(20,10,40,0.22),0 0 0 3px #fff;flex-shrink:0;}
  .artist-box.dead .logo-badge{filter:grayscale(1);opacity:0.6;}
  .artist-box .status-stamp{position:absolute;top:4px;right:4px;font-size:15px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.2));}
  .artist-box.cleared .status-stamp{animation:stampIn .4s cubic-bezier(0.16,1,0.3,1) both;}
  .artist-box.dead .status-stamp{animation:stampIn .4s cubic-bezier(0.16,1,0.3,1) both;}
  .artist-box .name{font-family:var(--display);font-size:13px;font-weight:700;line-height:1.2;}
  .artist-box.dead .name{text-decoration:line-through;color:var(--txt2);}
  .artist-box .genre{font-size:9px;color:var(--txt2);margin-top:3px;}
  .artist-box .tagline{margin-top:4px;font-size:8.5px;font-weight:800;letter-spacing:0.06em;color:var(--txt2);padding:2px 7px;border-radius:10px;}
  .artist-box.cleared .tagline{color:var(--green);background:rgba(0,255,179,0.14);}
  .artist-box.dead .tagline{color:var(--red);background:rgba(255,51,85,0.12);}
  .board-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:10.5px;color:var(--txt2);font-weight:600;}
  .board-legend span{display:inline-flex;align-items:center;gap:5px;}
  .board-legend .lg-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .demo-block{padding:18px 18px 20px;background:var(--bg1);border:1px solid var(--border2);border-radius:8px;margin-bottom:24px;transition:border-color .3s;}
  .demo-cell{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;border:1px solid var(--border2);background:var(--bg2);color:var(--txt2);}
  .demo-cell.active{border-color:var(--blue);background:rgba(77,166,255,0.15);color:var(--blue);animation:pulse .8s infinite;}
  .demo-cell.cleared{border-color:var(--green);background:rgba(0,255,179,0.15);color:var(--green);}
  .demo-cell.dead{border-color:var(--red);background:rgba(255,51,85,0.12);color:var(--red);}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--bg1);border:1px solid var(--border2);border-radius:8px;max-width:460px;width:100%;padding:26px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-family:var(--display);font-size:22px;font-weight:800;margin-bottom:6px;}
  .modal p.sub{color:var(--txt2);font-size:12px;margin-bottom:18px;line-height:1.5;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:10px;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.08em;}
  .error-text{color:var(--red);font-size:11px;margin-top:8px;}

  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .qtimer{text-align:center;padding:5px 12px;border-radius:5px;flex-shrink:0;}
  .qtimer .tlbl{font-size:8px;letter-spacing:0.1em;margin-bottom:1px;font-weight:700;}
  .qtimer .tval{font-family:var(--display);font-size:20px;font-weight:800;line-height:1;}
  @keyframes tpulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .progress-dots{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
  .pdot{width:9px;height:9px;border-radius:50%;background:var(--border2);}
  .pdot.correct{background:var(--green);}
  .pdot.wrong{background:var(--red);}
  .pdot.current{background:var(--blue);}

  .q-block{border:1px solid var(--border2);background:var(--bg2);padding:16px 18px;margin-bottom:12px;border-radius:5px;transition:border-color .2s;}
  .q-block.feedback-correct{border-color:var(--green);}
  .q-block.feedback-wrong{border-color:var(--red);}
  .q-block .q-eyebrow{font-size:9px;color:var(--txt2);letter-spacing:0.1em;margin-bottom:8px;}
  .q-block .q-text{font-size:13.5px;line-height:1.5;font-weight:500;margin-bottom:12px;}
  .choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg1);border:1px solid var(--border);color:var(--txt2);padding:11px 14px;border-radius:3px;margin-bottom:7px;cursor:pointer;font-size:12px;font-family:var(--mono);transition:all .15s;}
  .choice:hover:not(:disabled){border-color:var(--border2);}
  .choice:disabled{cursor:default;}
  .choice .letter{width:20px;height:20px;border:1px solid var(--border2);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;color:var(--txt2);font-weight:700;}
  .choice.chosen-correct{border-color:var(--green);background:rgba(0,255,179,0.12);color:var(--txt);}
  .choice.chosen-correct .letter{border-color:var(--green);color:var(--green);}
  .choice.chosen-wrong{border-color:var(--red);background:rgba(255,51,85,0.1);color:var(--txt);}
  .choice.chosen-wrong .letter{border-color:var(--red);color:var(--red);}
  .choice.dimmed{opacity:0.5;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);padding:12px 20px;border-radius:6px;font-size:12px;z-index:300;display:none;max-width:90vw;text-align:center;}
  .footer-note{margin-top:50px;text-align:center;color:var(--txt3);font-size:10.5px;letter-spacing:0.02em;}
  .empty{text-align:center;color:var(--txt3);padding:50px 20px;font-size:12px;}
  .backlink{font-size:11px;color:var(--txt2);text-decoration:none;letter-spacing:0.04em;}
  .backlink:hover{color:var(--txt);}

  /* Spotlight — the soonest live/upcoming festival, given real hero treatment */
  .spotlight{position:relative;overflow:hidden;border-radius:14px;padding:32px 28px;margin-bottom:26px;text-decoration:none;display:block;color:var(--txt);border:1px solid var(--border2);box-shadow:0 12px 34px rgba(20,10,40,0.1);isolation:isolate;}
  .spotlight::before{content:'';position:absolute;inset:0;z-index:-2;background:var(--spot-bg,linear-gradient(120deg,#ff3d81,#a230ea));}
  .spotlight::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,0.08) 0%,rgba(255,255,255,0.85) 92%);}
  .spotlight .spot-eyebrow{font-size:10px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,0.25);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .spotlight .spot-name{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.02;margin-bottom:6px;}
  .spotlight .spot-meta{font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:16px;}
  .spotlight .spot-cta{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--txt);background:rgba(255,255,255,0.85);border:1px solid var(--border2);padding:9px 18px;border-radius:20px;}
  .countdown{display:inline-flex;gap:6px;}
  .countdown .cd-unit{background:rgba(255,255,255,0.9);border-radius:6px;padding:6px 9px;text-align:center;min-width:44px;box-shadow:0 2px 8px rgba(20,10,40,0.1);}
  .countdown .cd-unit .cd-num{font-family:var(--display);font-size:18px;font-weight:800;line-height:1;}
  .countdown .cd-unit .cd-lbl{font-size:7.5px;letter-spacing:0.08em;color:var(--txt2);text-transform:uppercase;}

  .trust-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:24px 0 30px;}
  .trust-strip .trust-item{text-align:center;padding:16px 10px;background:var(--bg1);border:1px solid var(--border);border-radius:12px;box-shadow:0 3px 10px rgba(20,10,40,0.05);}
  .trust-strip .trust-icon{width:42px;height:42px;line-height:42px;border-radius:50%;font-size:20px;margin:0 auto 8px;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 4px 12px rgba(255,61,129,0.3);}
  .trust-strip .trust-item:nth-child(2) .trust-icon{background:linear-gradient(135deg,var(--blue),var(--green));box-shadow:0 4px 12px rgba(47,123,255,0.3);}
  .trust-strip .trust-item:nth-child(3) .trust-icon{background:linear-gradient(135deg,var(--gold),var(--pink));box-shadow:0 4px 12px rgba(255,157,0,0.3);}
  .trust-strip .trust-title{font-family:var(--display);font-size:13px;font-weight:700;margin-bottom:3px;}
  .trust-strip .trust-sub{font-size:10.5px;color:var(--txt2);line-height:1.4;}

  .section-label{font-size:11px;color:var(--txt2);letter-spacing:0.14em;font-weight:800;text-transform:uppercase;margin:30px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,var(--pink),var(--gold),var(--purple),transparent);opacity:0.4;}

  .lineup-poster{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .lineup-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;background:var(--bg1);border:1px solid var(--border2);padding:6px 12px;border-radius:20px;}
  .lineup-chip .lc-genre{color:var(--txt2);font-weight:500;}
  .lineup-chip.is-cleared{border-color:var(--green);color:var(--green);}
  .lineup-chip.is-dead{border-color:var(--red);color:var(--red);opacity:0.7;text-decoration:line-through;}

  /* Confetti burst on a ticket win */
  .confetti-piece{position:fixed;top:-12px;z-index:400;pointer-events:none;border-radius:1px;animation:confettiFall linear forwards;}
  @keyframes confettiFall{to{transform:translateY(108vh) rotate(720deg);opacity:0.9;}}

  @media (max-width:600px){
    .hero h1{font-size:32px;}
    .spotlight .spot-name{font-size:26px;}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo" onclick="navigate('/')">FESTI<span>Q</span></div>
  <div style="display:flex;align-items:center;gap:14px;">
    <div class="nav-links">
      <a href="/pricing" onclick="return handleFestivalLinkClick(event,'/pricing')">Pricing</a>
      <a href="/faq" onclick="return handleFestivalLinkClick(event,'/faq')">FAQ</a>
      <a href="/account" id="account-nav-link" onclick="return handleFestivalLinkClick(event,'/account')" style="display:none;">My Account</a>
    </div>
    <div id="wallet-pill" class="wallet-pill" style="display:none;">🎟️ <span id="wallet-tokens">0</span> TOKENS</div>
    <button class="btn" id="auth-btn" onclick="openAuthModal()">LOG IN</button>
  </div>
</div>

<div id="app" class="wrap"></div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal">
    <h3 id="auth-title">Log In</h3>
    <p class="sub">One account works across every festival room.</p>
    <div class="field" id="name-field" style="display:none;">
      <label>Display Name</label>
      <input type="text" id="auth-name" placeholder="Alex">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••">
    </div>
    <div id="auth-error" class="error-text" style="display:none;"></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-purple" style="flex:1;" onclick="submitAuth()" id="auth-submit-btn">LOG IN</button>
      <button class="btn" onclick="closeModal('auth-modal')">CANCEL</button>
    </div>
    <p style="margin-top:16px;font-size:11px;color:var(--txt2);text-align:center;">
      <span id="auth-toggle-text">Don't have an account?</span>
      <a href="#" onclick="toggleAuthMode();return false;" style="color:var(--gold);text-decoration:none;font-weight:700;" id="auth-toggle-link">Sign up</a>
    </p>
  </div>
</div>

<!-- QUIZ MODAL -->
<div class="modal-overlay" id="quiz-modal">
  <div class="modal" id="quiz-modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let token = localStorage.getItem('festiq_token') || null;
let user = JSON.parse(localStorage.getItem('festiq_user') || 'null');
let authMode = 'login';
let currentFestival = null;
let currentAttempt = null;

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3400);
}

function authHeaders(){ return token ? { 'Authorization': 'Bearer ' + token } : {}; }

function updateAuthUI(){
  const btn = document.getElementById('auth-btn');
  const pill = document.getElementById('wallet-pill');
  const acctLink = document.getElementById('account-nav-link');
  if (user) {
    btn.textContent = user.display_name.toUpperCase() + ' — LOG OUT';
    btn.onclick = logout;
    pill.style.display = 'flex';
    if (acctLink) acctLink.style.display = 'inline';
    refreshWallet();
  } else {
    btn.textContent = 'LOG IN';
    btn.onclick = openAuthModal;
    pill.style.display = 'none';
    if (acctLink) acctLink.style.display = 'none';
  }
}

function refreshWallet(){
  if (!token) return;
  fetch(`${API}/api/wallet`, { headers: authHeaders() }).then(r => r.json()).then(d => {
    if (d.tokens !== undefined) document.getElementById('wallet-tokens').textContent = d.tokens;
  });
}

function claimFreeToken(){
  fetch(`${API}/api/wallet/claim-free`, { method: 'POST', headers: authHeaders() })
    .then(r => r.json()).then(d => {
      if (d.error) { toast(d.retry_after_ms ? 'Come back later for your next free token' : d.error); return; }
      toast('+1 free token claimed!');
      refreshWallet();
    });
}

function demoBuyTokens(qty){
  fetch(`${API}/api/wallet/demo-buy-tokens`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ quantity: qty }) })
    .then(r => r.json()).then(d => {
      toast(`+${qty} tokens added (demo — no real charge)`);
      refreshWallet();
    });
}

function openAuthModal(){ document.getElementById('auth-modal').classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function toggleAuthMode(){
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('auth-title').textContent = authMode === 'login' ? 'Log In' : 'Sign Up';
  document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'LOG IN' : 'SIGN UP';
  document.getElementById('name-field').style.display = authMode === 'register' ? 'block' : 'none';
  document.getElementById('auth-toggle-text').textContent = authMode === 'login' ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('auth-toggle-link').textContent = authMode === 'login' ? 'Sign up' : 'Log in';
}

function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const display_name = document.getElementById('auth-name').value.trim();
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  const path = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
  const body = authMode === 'login' ? { email, password } : { email, password, display_name };
  fetch(`${API}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(r => r.json()).then(d => {
      if (d.error) { errEl.textContent = d.error; errEl.style.display = 'block'; return; }
      token = d.token; user = d.user;
      localStorage.setItem('festiq_token', token);
      localStorage.setItem('festiq_user', JSON.stringify(user));
      closeModal('auth-modal');
      updateAuthUI();
      render();
    });
}

function logout(){
  token = null; user = null;
  localStorage.removeItem('festiq_token'); localStorage.removeItem('festiq_user');
  updateAuthUI(); navigate('/');
}

// ─── Routing ────────────────────────────────────────────────────────────────
// Real paths (/festival/slug), not hash fragments — hash routes are invisible
// to search engines and to link-preview scrapers, and don't give each
// festival a real, bookmarkable, shareable URL. history.pushState swaps the
// URL with no full reload; the server (see server.js) renders the exact same
// shell at each real path too, so a fresh visit or a share link both work.

function navigate(path){
  if (window.location.pathname === path) return;
  history.pushState({}, '', path);
  render();
}
window.addEventListener('popstate', render);

// Renamed slugs redirect server-side (see LEGACY_SLUG_REDIRECTS in
// server.js) for a fresh page load; this client-side copy only matters for
// the hash-cleanup path just below, which never hits the server.
const LEGACY_SLUG_REDIRECTS = { 'acl-festival': 'austin-city-limits' };

function render(){
  // One-time cleanup for old-style shared links (#/f/slug) from before real
  // paths existed — send them to the real URL instead of just rendering it,
  // so the address bar is correct going forward too.
  if (window.location.hash.startsWith('#/f/')) {
    const slug = window.location.hash.slice(4);
    history.replaceState({}, '', '/festival/' + (LEGACY_SLUG_REDIRECTS[slug] || slug));
  }
  const path = window.location.pathname;
  if (path.startsWith('/festival/')) renderFestival(decodeURIComponent(path.slice('/festival/'.length)));
  else if (path === '/pricing') renderPricing();
  else if (path === '/faq') renderFAQ();
  else if (path === '/account') renderAccount();
  else renderList();
}

// A plain left-click on a real <a href="/festival/slug"> intercepts into
// pushState (no reload); ctrl/cmd/shift/middle-click still opens normally
// (new tab, etc.) since those never reach preventDefault.
function handleFestivalLinkClick(e, path){
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return true;
  e.preventDefault();
  navigate(path);
  return false;
}

function daysHoursUntil(raw){
  const ts = parseFestivalDate(raw);
  if (!isFinite(ts)) return null;
  const diff = ts - Date.now();
  if (diff <= 0) return null;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  return { days, hours };
}

function countdownHTML(raw){
  const d = daysHoursUntil(raw);
  if (!d) return '';
  return `<div class="countdown">
    <div class="cd-unit"><div class="cd-num">${d.days}</div><div class="cd-lbl">Days</div></div>
    <div class="cd-unit"><div class="cd-num">${d.hours}</div><div class="cd-lbl">Hrs</div></div>
  </div>`;
}

function trustStripHTML(){
  return `
    <div class="trust-strip">
      <div class="trust-item"><div class="trust-icon">🎤</div><div class="trust-title">Real Lineups</div><div class="trust-sub">Every artist and set is pulled from the actual festival bill.</div></div>
      <div class="trust-item"><div class="trust-icon">🧠</div><div class="trust-title">Skill, Not Luck</div><div class="trust-sub">Know the acts? Clear the board. No random draws.</div></div>
      <div class="trust-item"><div class="trust-icon">🎟️</div><div class="trust-title">Real Tickets</div><div class="trust-sub">Land a line and claim an actual ticket to the show.</div></div>
    </div>
  `;
}

// The soonest festival worth featuring big — prefers a live one, falls back
// to the nearest upcoming date. Gives the lobby an actual focal point
// instead of a flat grid of identical cards.
function spotlightHTML(list){
  const candidates = [...list].sort((a, b) => parseFestivalDate(a.event_date) - parseFestivalDate(b.event_date));
  const f = candidates.find(x => x.status === 'live') || candidates.find(x => isFinite(parseFestivalDate(x.event_date)));
  if (!f) return '';
  const cd = countdownHTML(f.event_date);
  return `
    <a href="/festival/${f.slug}" onclick="return handleFestivalLinkClick(event,'/festival/${f.slug}')" class="spotlight" style="--spot-bg:linear-gradient(120deg, ${f.banner_color || '#ff3d81'}, #a230ea);">
      <div class="spot-eyebrow">⚡ ${f.status === 'live' ? "PLAYING NOW" : "UP NEXT"}</div>
      <div class="spot-name">${f.name}</div>
      <div class="spot-meta">${f.location || ''} ${f.event_date ? '· ' + f.event_date : ''} ${f.status === 'live' ? `· 🎁 ${f.ticket_prize_label || 'Ticket prize'}` : '· Lineup drops soon'}</div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
        ${cd}
        <span class="spot-cta">${f.status === 'live' ? 'PLAY THE BOARD →' : 'GET NOTIFIED →'}</span>
      </div>
    </a>
  `;
}

// ─── Animated "how it works" demo board (mirrors PropQuix's guest demo) ─────

const DEMO_ICONS = ["🎤","🎧","🥁","🎸","🎹","🎺","🕺","🎷","🎻"];
let demoTimeouts = [];
function clearDemoTimers(){ demoTimeouts.forEach(clearTimeout); demoTimeouts = []; }
function demoSchedule(fn, delay){ const id = setTimeout(fn, delay); demoTimeouts.push(id); }

function runDemo(){
  clearDemoTimers();
  const gridEl = document.getElementById('demo-grid');
  const capEl = document.getElementById('demo-caption');
  if (!gridEl) return; // navigated away

  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const state = Array(9).fill('locked');

  const setState = (i, s) => { state[i] = s; renderDemoGrid(); };
  const renderDemoGrid = () => {
    gridEl.innerHTML = state.map((s, i) => `
      <div class="demo-cell ${s}">${s === 'cleared' ? '✓' : s === 'dead' ? '💀' : DEMO_ICONS[i]}</div>
    `).join('');
  };
  renderDemoGrid();

  const bust = Math.random() < 0.3;
  let t = 500;

  if (bust) {
    capEl.textContent = 'A rough run — squares are starting to die off…';
    const bustSet = [0,1,3,7,8];
    bustSet.forEach((idx, i) => {
      demoSchedule(() => { setState(idx, 'active'); }, t); t += 450;
      demoSchedule(() => {
        setState(idx, 'dead');
        capEl.textContent = i < bustSet.length - 1 ? '💀 Wrong answer — that artist is dead for this board…' : '💀 That was the last line…';
      }, t); t += 550;
    });
    demoSchedule(() => { capEl.textContent = '💥 BUSTED — no line is possible anymore. Board over.'; }, t); t += 2400;
    demoSchedule(runDemo, t);
    return;
  }

  const pattern = lines[Math.floor(Math.random() * lines.length)];
  const distractor = [0,1,2,3,4,5,6,7,8].find(i => !pattern.includes(i));
  capEl.textContent = 'Pick any artist square to answer their trivia…';

  demoSchedule(() => { setState(distractor, 'active'); capEl.textContent = 'Attempting an artist quiz…'; }, t); t += 650;
  demoSchedule(() => { setState(distractor, 'dead'); capEl.textContent = "💀 Didn't clear it — dead for this board, no retry."; }, t); t += 1000;

  pattern.forEach((idx, i) => {
    demoSchedule(() => { setState(idx, 'active'); capEl.textContent = i === 0 ? 'Clearing a line…' : 'Keep going…'; }, t); t += 700;
    demoSchedule(() => { setState(idx, 'cleared'); capEl.textContent = '✅ Artist cleared!'; }, t); t += 800;
  });

  demoSchedule(() => { capEl.textContent = '🎉 Line complete! Ticket won!'; }, t); t += 2600;
  demoSchedule(runDemo, t);
}

function renderDemo(){
  return `
    <div class="demo-block" id="demo-block">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px;">
        <div style="font-size:10px;color:var(--txt2);letter-spacing:0.12em;font-weight:700;text-transform:uppercase;">🎮 See how it works</div>
        <div style="font-size:10px;color:var(--txt2);letter-spacing:0.06em;">DEMO — not a real board</div>
      </div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:center;">
        <div class="board-grid" id="demo-grid" style="grid-template-columns:repeat(3,1fr);width:150px;flex-shrink:0;"></div>
        <div style="flex:1;min-width:200px;">
          <div id="demo-caption" style="font-size:12.5px;font-weight:600;color:var(--txt);margin-bottom:6px;min-height:18px;">Watch how the board plays…</div>
          <div style="font-size:11px;color:var(--txt2);line-height:1.6;">Each square is one artist's trivia, one shot only. Complete any row, column, or diagonal of cleared artists and you win a ticket. Miss enough squares that no line is left possible, and that board's done.</div>
        </div>
      </div>
    </div>
  `;
}

// event_date is free text ("2026-10-17", "Oct. 2–4 & Oct. 9–11, 2026",
// "2027 TBD", "Varies / next event dependent on city") — best-effort parse
// to a sortable timestamp so the grid can show soonest-first. Anything
// unparseable sorts to the very end rather than breaking the sort.
function parseFestivalDate(raw){
  if (!raw) return Infinity;
  const iso = Date.parse(raw);
  if (!isNaN(iso) && /^\d{4}-\d{2}-\d{2}/.test(raw.trim())) return iso;
  const monthDayYear = raw.match(/([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:[–\-]\d{1,2})?.*?,?\s*(\d{4})/);
  if (monthDayYear) {
    const parsed = Date.parse(`${monthDayYear[1]} ${monthDayYear[2]}, ${monthDayYear[3]}`);
    if (!isNaN(parsed)) return parsed;
  }
  const yearOnly = raw.match(/\b(20\d{2})\b/);
  if (yearOnly) return Date.parse(`Jan 1, ${yearOnly[1]}`);
  return Infinity;
}

function renderList(){
  clearDemoTimers();
  document.title = 'FestiQ — Festival Trivia Bingo to Win Real Tickets';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">Festival Trivia Bingo · Play Anytime</div>
      <h1>WIN REAL <span style="color:var(--gold);">FESTIVAL TICKETS</span> PLAYING TRIVIA BINGO</h1>
      <p>Pick a festival, pick an artist on the lineup, answer their trivia. Land a full row, column, or diagonal and you win a ticket — no luck of the draw, just knowing the lineup.</p>
    </div>
    ${trustStripHTML()}
    <div id="spotlight-slot"></div>
    ${renderDemo()}
    <div class="section-label">All Festivals</div>
    <div class="festival-grid" id="festival-grid"><div class="empty">Loading festivals…</div></div>
    <div class="footer-note">FestiQ — a prototype. Real ticket sourcing &amp; payments not wired up yet.</div>
  `;
  runDemo();
  fetch(`${API}/api/festivals`).then(r => r.json()).then(list => {
    const grid = document.getElementById('festival-grid');
    const spotSlot = document.getElementById('spotlight-slot');
    if (!list.length) { grid.innerHTML = '<div class="empty">No festivals live yet.</div>'; if (spotSlot) spotSlot.innerHTML = ''; return; }
    if (spotSlot) spotSlot.innerHTML = spotlightHTML(list);
    const sorted = [...list].sort((a, b) => parseFestivalDate(a.event_date) - parseFestivalDate(b.event_date));
    grid.innerHTML = sorted.map(f => {
      const isLive = f.status === 'live';
      const soldOut = isLive && f.tickets_awarded >= f.tickets_available;
      const tag = !isLive ? { cls: 'tag-upcoming', label: 'Upcoming' }
                : soldOut ? { cls: 'tag-won', label: 'Tickets Claimed' }
                : { cls: 'tag-live', label: 'Live' };
      const cd = daysHoursUntil(f.event_date);
      return `
      <a class="festival-card ${!isLive ? 'is-upcoming' : ''}" href="/festival/${f.slug}"
         onclick="return handleFestivalLinkClick(event,'/festival/${f.slug}')"
         style="text-decoration:none;color:inherit;--fc-accent:${f.banner_color};">
        <div class="festival-banner" style="background:linear-gradient(135deg, ${f.banner_color}, ${f.banner_color}dd 40%, #ffffff 130%);">
          <span class="tag ${tag.cls}" style="background:rgba(255,255,255,0.85);">${tag.label}</span>
        </div>
        <div class="festival-body">
          <h3>${f.name}</h3>
          <div class="meta">${f.location || ''} ${f.event_date ? '· ' + f.event_date : ''}${cd ? ` · in ${cd.days}d` : ''}</div>
          ${isLive
            ? `<div class="meta">${f.lineup_count} artists on the board · 🎟️ ${f.entry_cost_tokens} token${f.entry_cost_tokens === 1 ? '' : 's'}/try</div>
               <div class="meta" style="display:inline-flex;align-items:center;gap:5px;color:var(--gold);font-weight:800;background:rgba(255,157,0,0.1);padding:4px 9px;border-radius:20px;">🎁 ${f.ticket_prize_label} · up to ${f.tickets_available} ticket${f.tickets_available === 1 ? '' : 's'}</div>`

// Small static illustration of what "1 line" vs "2 lines" looks like on
// this festival's actual board size — same idea as PropQuix Solo's
// TierExplainer mini-boards, drawn with plain divs instead of React.
function miniBoardHTML(gridSize, firstLine, secondLine){
  const total = gridSize * gridSize;
  let cells = '';
  for (let i = 0; i < total; i++) {
    const isFirst = firstLine.includes(i);
    const isSecond = secondLine && secondLine.includes(i);
    const color = isSecond ? 'var(--gold)' : isFirst ? 'var(--green)' : 'var(--txt3)';
    const bg = isSecond ? 'rgba(255,213,79,0.18)' : isFirst ? 'rgba(0,255,179,0.14)' : 'var(--bg2)';
    cells += `<div style="aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid ${color};background:${bg};color:${color};">${isFirst || isSecond ? '✓' : ''}</div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(${gridSize},1fr);gap:4px;width:${gridSize * 28}px;margin:0 auto;">${cells}</div>`;
}

function tierExplainerHTML(f){
  const g = f.grid_size;
  const firstLine = Array.from({ length: g }, (_, i) => i); // top row
  const secondLine = Array.from({ length: g }, (_, i) => i * g); // left column — shares one square with the first line
  const showTier2 = f.tickets_available >= 2;
  return `
    <div style="margin-bottom:26px;">
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:14px;">
        <div style="padding:18px 14px;border-radius:8px;border:1px solid var(--green);background:rgba(0,255,179,0.06);text-align:center;">
          <div style="font-family:var(--display);font-size:15px;font-weight:800;color:var(--green);line-height:1;">1 TICKET</div>
          <div style="font-size:9.5px;color:var(--green);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;">${f.ticket_prize_label}</div>
          ${miniBoardHTML(g, firstLine)}
          <div style="font-size:10.5px;color:var(--txt2);margin-top:10px;">Clear any 1 row, column, or diagonal first</div>
        </div>
        ${showTier2 ? `
        <div style="padding:18px 14px;border-radius:8px;border:1px solid var(--gold);background:rgba(255,213,79,0.06);text-align:center;">
          <div style="font-family:var(--display);font-size:15px;font-weight:800;color:var(--gold);line-height:1;">2 TICKETS</div>
          <div style="font-size:9.5px;color:var(--gold);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;">${f.ticket_prize_label} ×2</div>
          ${miniBoardHTML(g, firstLine, secondLine)}
          <div style="font-size:10.5px;color:var(--txt2);margin-top:10px;">Then land a 2nd line, if one's still reachable</div>
        </div>` : ''}
      </div>
      <div style="margin-top:10px;font-size:10px;color:var(--txt2);text-align:center;">
        💀 Every square is one shot — fail it and it's dead for this board. If no line can ever be completed anymore, that's a bust: game over.
      </div>
    </div>
  `;
}

        <span><span class="lg-dot" style="background:var(--purple);"></span>${cells.filter(c => c.status === 'available').length} available — tap to play</span>
        <span><span class="lg-dot" style="background:var(--green);"></span>${clearedCount} cleared</span>
        <span><span class="lg-dot" style="background:var(--red);"></span>${cells.filter(c => c.status === 'dead').length} dead — no retry</span>
      </div>` : ''}
      <div class="board-grid ${!isLive ? 'is-locked' : ''}" id="board-grid" style="grid-template-columns:repeat(${f.grid_size},1fr);"></div>
      <div class="footer-note">${isLive ? `Entry costs ${f.entry_cost_tokens} token${f.entry_cost_tokens === 1 ? '' : 's'} per artist attempt. Fail and that artist is dead for this board — no retries.` : `This board opens for real attempts once FestiQ marks ${f.name} live.`}</div>
    `;

    if (isLive) {
      refreshWallet();
      // wallet pill already updates the header; mirror it into the stat tile too
      if (token) {
        fetch(`${API}/api/wallet`, { headers: authHeaders() }).then(r => r.json()).then(d => {
          const el = document.getElementById('wallet-stat');
          if (el && d.tokens !== undefined) el.textContent = d.tokens;
        });
      }
    }

    renderBoardGrid(cells, f.grid_size, !isLive);
  });
}

// Deterministic per-artist "logo" — real band logos aren't ours to use, so
// each artist gets a consistent monogram badge (initials + a hashed hue)
// that acts like a real identity mark instead of a generic mic icon for
// every single box.
function hashHue(str){
  let h = 0;
  for (let i = 0; i < (str || '').length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; }
  return h % 360;
}
function artistInitials(name){
  const words = (name || '?').trim().split(/\s+/).filter(Boolean);
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}
function artistAccent(name){
  const hue = hashHue(name);
  return { accent: `hsl(${hue},70%,52%)`, glow: `hsla(${hue},85%,60%,0.35)`, tint: `hsl(${hue},85%,95%)` };
}

// locked=true renders the same board (used for a not-yet-live festival that
// already has its lineup entered) with no click/hover interaction and a
// grayed, muted look instead of the lively "available" treatment — a
// preview of the room, not a playable one yet.
function renderBoardGrid(cells, gridSize, locked){
  const grid = document.getElementById('board-grid');
  const sorted = [...cells].sort((a,b) => a.position - b.position);
  grid.innerHTML = sorted.map((c, i) => {
    const { accent, glow, tint } = artistAccent(c.name);
    const stamp = c.status === 'cleared' ? '✅' : c.status === 'dead' ? '💀' : '';
    const handlers = locked ? '' : `onmouseenter="hoverLine(${c.position}, ${gridSize})" onmouseleave="clearHoverLine()" onclick="handleBoxClick(${c.artist_id}, '${c.status}')"`;
    return `
    <div class="artist-box ${c.status} ${locked ? 'locked' : ''}" data-pos="${c.position}" style="--box-accent:${locked ? 'var(--txt3)' : accent};--box-glow:${glow};--box-tint:${tint};animation-delay:${Math.min(i * 35, 400)}ms;"
         ${handlers}>
      ${stamp ? `<div class="status-stamp">${stamp}</div>` : ''}
      <div class="logo-badge" style="background:${locked || c.status === 'dead' ? 'var(--txt3)' : accent};">${artistInitials(c.name)}</div>
      <div class="name">${c.name}</div>
      <div class="genre">${c.genre || ''}</div>
      <div class="tagline">${locked ? '🔒 LOCKED' : c.status === 'cleared' ? 'CLEARED' : c.status === 'dead' ? 'DEAD — NO RETRY' : 'PLAY →'}</div>
    </div>
  `;
  }).join('');
}

// Hover a cell → highlight its full row/column (mirrors PropQuix's board hover)
function hoverLine(pos, gridSize){
  const row = Math.floor(pos / gridSize), col = pos % gridSize;
  document.querySelectorAll('#board-grid .artist-box').forEach(el => {
    const p = parseInt(el.dataset.pos, 10);
    const r = Math.floor(p / gridSize), c = p % gridSize;
    const inLine = r === row || c === col;
    el.classList.toggle('inline', inLine);
    el.classList.toggle('dimmed', !inLine);
  });
}
function clearHoverLine(){
  document.querySelectorAll('#board-grid .artist-box').forEach(el => {
    el.classList.remove('inline', 'dimmed');
  });
}

function handleBoxClick(artistId, status){
  if (!user) { openAuthModal(); return; }
  if (status !== 'available') return;
  if (currentFestival.board && currentFestival.board.won_ticket) { toast('You already won a ticket to this festival!'); return; }
  fetch(`${API}/api/festivals/${currentFestival.slug}/start`, {
    method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ artist_id: artistId })
  }).then(r => r.json()).then(d => {
    if (d.error) { toast(d.error); return; }
    currentAttempt = {
      id: d.attempt_id, questions: d.questions, artist: d.artist, level: d.level,
      passThreshold: d.pass_threshold, current: 0, results: Array(d.questions.length).fill(null),
      answering: false, feedback: null, timer: null,
      timeLeft: d.questions.length * (d.level?.secondsPerQuestion || 15),
    };
    refreshWallet();
    openQuiz();
    startQuizTimer();
  });
}

function startQuizTimer(){
  clearInterval(currentAttempt.timer);
  currentAttempt.timer = setInterval(() => {
    const a = currentAttempt;
    if (!a) return;
    a.timeLeft -= 1;
    if (a.timeLeft <= 0) {
      a.timeLeft = 0;
      clearInterval(a.timer);
      renderTimer();
      submitQuiz();
      return;
    }
    renderTimer();
  }, 1000);
}

function renderTimer(){
  const el = document.getElementById('qtimer-val');
  if (!el || !currentAttempt) return;
  const t = currentAttempt.timeLeft;
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(t % 60).padStart(2, '0');
  const color = t <= 20 ? 'var(--red)' : t <= 60 ? 'var(--gold)' : 'var(--green)';
  el.style.color = color;
  el.textContent = `${mm}:${ss}`;
  el.style.animation = t <= 15 ? 'tpulse 0.8s infinite' : 'none';
  const box = document.getElementById('qtimer-box');
  if (box) { box.style.background = `${color}15`; box.style.borderColor = `${color}44`; }
  const lbl = document.getElementById('qtimer-lbl');
  if (lbl) lbl.style.color = color;
}

function openQuiz(){
  const d = currentAttempt;
  const body = document.getElementById('quiz-modal-body');
  body.innerHTML = `
    <div class="qmeta">
      <div>
        <div style="font-size:10px;color:var(--txt2);letter-spacing:0.1em;">${d.artist.genre ? d.artist.genre.toUpperCase() : ''} · ${d.artist.name.toUpperCase()}</div>
        <div style="font-size:11px;color:var(--txt2);margin-top:2px;">Question <span id="qcurrent">1</span> of ${d.questions.length} · need ${d.passThreshold}/${d.questions.length} correct to clear
          ${typeof d.level?.estPassRatePct === 'number' ? ` · 📊 ~${d.level.estPassRatePct}% modeled pass rate — one shot, hard on purpose` : ''}</div>
      </div>
      <div class="qtimer" id="qtimer-box" style="border:1px solid var(--border2);">
        <div class="tlbl" id="qtimer-lbl" style="color:var(--green);">TIME LEFT</div>
        <div class="tval" id="qtimer-val" style="color:var(--green);"></div>
      </div>
    </div>
    <div class="progress-dots" id="qdots"></div>
    <div id="quiz-questions"></div>
    <div style="display:flex;gap:10px;margin-top:6px;justify-content:center;">
      <button class="btn" onclick="submitQuiz()">SUBMIT QUIZ NOW →</button>
    </div>
  `;
  renderTimer();
  renderQuizDots();
  renderCurrentQuestion();
  document.getElementById('quiz-modal').classList.add('open');
}

function renderQuizDots(){
  const el = document.getElementById('qdots');
  if (!el || !currentAttempt) return;
  const a = currentAttempt;
  el.innerHTML = a.results.map((r, i) => {
    const cls = r === 'correct' ? 'correct' : r === 'wrong' ? 'wrong' : i === a.current ? 'current' : '';
    return `<div class="pdot ${cls}"></div>`;
  }).join('');
}

function renderCurrentQuestion(){
  const a = currentAttempt;
  const i = a.current;
  const q = a.questions[i];
  const qEl = document.getElementById('quiz-questions');
  const curEl = document.getElementById('qcurrent');
  if (curEl) curEl.textContent = i + 1;
  qEl.innerHTML = `
    <div class="q-block" id="qblock">
      <div class="q-eyebrow">QUESTION ${i+1} OF ${a.questions.length}</div>
      <div class="q-text">${q.question}</div>
      ${q.choices.map((choice, ci) => `
        <button class="choice" id="choice-${ci}" onclick="answerChoice(${ci})">
          <span class="letter">${String.fromCharCode(65+ci)}</span>${choice}
        </button>
      `).join('')}
    </div>
  `;
}

function answerChoice(choiceIndex){
  const a = currentAttempt;
  if (a.answering || a.feedback) return;
  a.answering = true;
  const qIndex = a.current;
  fetch(`${API}/api/festivals/${currentFestival.slug}/answer`, {
    method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ attempt_id: a.id, question_index: qIndex, choice_index: choiceIndex })
  }).then(r => r.json()).then(d => {
    a.answering = false;
    if (d.error) { toast(d.error); return; }
    a.results[qIndex] = d.correct ? 'correct' : 'wrong';
    a.feedback = { correct: d.correct, chosen: choiceIndex };
    renderQuizDots();

    const block = document.getElementById('qblock');
    if (block) block.classList.add(d.correct ? 'feedback-correct' : 'feedback-wrong');
    document.querySelectorAll('#quiz-questions .choice').forEach((el, ci) => {
      el.disabled = true;
      if (ci === choiceIndex) el.classList.add(d.correct ? 'chosen-correct' : 'chosen-wrong');
      else el.classList.add('dimmed');
    });

    setTimeout(() => {
      a.feedback = null;
      const next = a.current + 1;
      if (next >= a.questions.length) { submitQuiz(); return; }
      a.current = next;
      renderQuizDots();
      renderCurrentQuestion();
    }, 900);
  }).catch(() => { a.answering = false; toast('Network hiccup — tap an answer again.'); });
}

function submitQuiz(){
  const a = currentAttempt;
  if (!a || a.submitting) return;
  a.submitting = true;
  clearInterval(a.timer);
  fetch(`${API}/api/festivals/${currentFestival.slug}/submit`, {
    method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ attempt_id: a.id })
  }).then(r => r.json()).then(d => {
    if (d.error) { toast(d.error); closeModal('quiz-modal'); return; }
    closeModal('quiz-modal');
    if (d.ticket_won) {
      const tierMsg = d.board.lines_completed >= d.board.max_tiers ? ' — max tickets reached, board complete!' : ' — keep going, a 2nd line is still in play!';
      fireConfetti();
      toast(`🎉 LINE COMPLETE! You won: ${d.ticket_won.prize} — claim code ${d.ticket_won.claim_code}${tierMsg}`);
    } else if (d.passed && d.board.lines_completed >= 1 && !d.next_line_reachable) {
      toast(`✅ ${d.artist.name} cleared — but a 2nd line is no longer reachable. Your ticket is locked in either way.`);
    } else if (d.passed) {
      toast(`✅ Correct — ${d.artist.name} cleared! (${d.correct_count}/${d.total})`);
    } else if (d.busted) {
      toast(`💥 ${d.artist.name} not cleared (${d.correct_count}/${d.total}) — and no line is possible anymore. Board over.`);
    } else {
      toast(`❌ ${d.artist.name} is dead for this board (${d.correct_count}/${d.total}, needed ${d.pass_threshold})`);
    }
    renderFestival(currentFestival.slug);
  });
}

// Small celebratory confetti burst — plain DOM/CSS, no canvas or library.
function fireConfetti(){
  const colors = ['#ff3d81','#ff9d00','#ffe066','#00e5a0','#2f9bff','#a230ea'];
  const count = 60;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    const size = 6 + Math.random() * 6;
    el.className = 'confetti-piece';
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.width = size + 'px';
    el.style.height = (size * 0.4) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
}

updateAuthUI();
render();
</script>
</body>
