// Deterministic per-artist "logo" — real band logos aren't ours to use, so
// each artist gets a consistent monogram badge (initials + a hashed hue)
// that acts like a real identity mark instead of a generic mic icon for
// every single box.
function hashHue(str){
  let h = 0;
  for (let i = 0; i < (str || '').length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; }
  return h % 360;
}
function artistInitials(name){
  const words = (name || '?').trim().split(/\s+/).filter(Boolean);
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}
function artistAccent(name){
  const hue = hashHue(name);
  return { accent: `hsl(${hue},70%,52%)`, glow: `hsla(${hue},85%,60%,0.35)`, tint: `hsl(${hue},85%,95%)` };
}

// Sits over the whole board once it's over — either fully dead with no line
// ever reachable again, or maxed out at every ticket this board can pay —
// so there's always an obvious next action instead of a few grayed-out
// squares and no explanation. "Try Again" resets every square to available
// on a brand-new board (see POST /reset in server.js) — a clean card, not a
// harder one: the pace curve (BOARD_PACE_PREVIEW) is keyed to how many
// squares are resolved on the CURRENT board, so a fresh board always starts
// back at the top of the curve (18s/question) same as your very first one.
function boardOverOverlayHTML(f, linesCompleted, maxTiers){
  const maxedOut = linesCompleted >= maxTiers;
  if (maxedOut) {
    return `
      <div class="board-over-overlay">
        <div class="boo-card">
          <div class="boo-icon">🏆</div>
          <div class="boo-title">BOARD COMPLETE</div>
          <div class="boo-sub">You banked the max ${maxTiers} ticket${maxTiers === 1 ? '' : 's'} this board can pay out. Nice run.</div>
          <a href="/account" onclick="return handleFestivalLinkClick(event,'/account')" class="btn btn-gold" style="display:inline-flex;text-decoration:none;">VIEW MY TICKETS →</a>
        </div>
      </div>`;
  }
  return `
    <div class="board-over-overlay">
      <div class="boo-card">
        <div class="boo-icon">💀</div>
        <div class="boo-title">BOARD OVER</div>
        <div class="boo-sub">${linesCompleted >= 1 ? `You banked ${linesCompleted} ticket${linesCompleted === 1 ? '' : 's'}, but no line is left to complete.` : 'Every remaining line already has a dead square in it — no line was still possible.'} Start a fresh board and go again.</div>
        <div class="boo-gen">⚡ Fresh board — starts back at ${BOARD_PACE_PREVIEW[0]}s per question</div>
        <button class="btn btn-gold" onclick="tryAgainBoard('${f.slug}')">🔄 TRY AGAIN</button>
      </div>
    </div>`;
}

function tryAgainBoard(slug){
  if (!user) { openAuthModal(); return; }
  fetch(`${API}/api/festivals/${slug}/reset`, {
    method: 'POST', headers: authHeaders()
  }).then(async r => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not reset this board');
    return d;
  }).then(() => {
    toast('🔄 Fresh board! Every square is back in play, clean pace from the top.');
    renderFestival(slug);
  }).catch(err => toast(err.message, true));
}

// locked=true renders the same board (used for a not-yet-live festival that
// already has its lineup entered) with no click/hover interaction and a
// grayed, muted look instead of the lively "available" treatment — a
// preview of the room, not a playable one yet.
function renderBoardGrid(cells, gridSize, locked, boardOver){
  const grid = document.getElementById('board-grid');
  const effectiveLocked = locked || boardOver;
  const sorted = [...cells].sort((a,b) => a.position - b.position);
  grid.innerHTML = sorted.map((c, i) => {
    // Lineup not announced yet — a dashed "mystery box" placeholder instead
    // of a real artist card. No accent color to hash (there's no name yet),
    // no click/hover handlers, no status stamp.
    if (c.status === 'pending') {
      return `
      <div class="artist-box pending" data-pos="${c.position}" style="animation-delay:${Math.min(i * 35, 400)}ms;">
        <div class="logo-badge">🎫</div>
        <div class="name">TBA</div>
        <div class="genre">&nbsp;</div>
        <div class="tagline">COMING SOON</div>
      </div>
    `;
    }
    const { accent, glow, tint } = artistAccent(c.name);
    const stamp = c.status === 'cleared' ? '✅' : c.status === 'dead' ? '💀' : '';
    const handlers = effectiveLocked ? '' : `onmouseenter="hoverLine(${c.position}, ${gridSize})" onmouseleave="clearHoverLine()" onclick="handleBoxClick(${c.artist_id}, '${c.status}')"`;
    let tagline;
    if (boardOver && c.status === 'available') tagline = '⛔ GAME OVER';
    else if (locked) tagline = '🔒 LOCKED';
    else if (c.status === 'cleared') tagline = 'CLEARED';
    else if (c.status === 'dead') tagline = 'DEAD — NO RETRY';
    else tagline = 'PLAY →';
    return `
    <div class="artist-box ${c.status} ${effectiveLocked ? 'locked' : ''}" data-pos="${c.position}" style="--box-accent:${effectiveLocked ? 'var(--txt3)' : accent};--box-glow:${glow};--box-tint:${tint};animation-delay:${Math.min(i * 35, 400)}ms;"
         ${handlers}>
      ${stamp ? `<div class="status-stamp">${stamp}</div>` : ''}
      ${!effectiveLocked && c.status === 'available' ? `<div class="tile-cost-badge">🎟️${c.token_cost ?? 1}</div>` : ''}
      <div class="logo-badge" style="background:${effectiveLocked || c.status === 'dead' ? 'var(--txt3)' : accent};">${artistInitials(c.name)}</div>
      <div class="name">${c.name}</div>
      <div class="genre">${c.genre || ''}</div>
      <div class="tagline">${tagline}</div>
    </div>
  `;
  }).join('');
}

// Hover a cell → highlight its full row/column (mirrors PropQuix's board hover)
function hoverLine(pos, gridSize){
  const row = Math.floor(pos / gridSize), col = pos % gridSize;
  document.querySelectorAll('#board-grid .artist-box').forEach(el => {
    const p = parseInt(el.dataset.pos, 10);
    const r = Math.floor(p / gridSize), c = p % gridSize;
    const inLine = r === row || c === col;
    el.classList.toggle('inline', inLine);
    el.classList.toggle('dimmed', !inLine);
  });
}
function clearHoverLine(){
  document.querySelectorAll('#board-grid .artist-box').forEach(el => {
    el.classList.remove('inline', 'dimmed');
  });
}

// Display-only mirror of the server's QUESTIONS_PER_QUIZ/BOARD_PACE_SECONDS
// constants (server.js) — used purely to show an accurate cost/time preview
// in the confirm-play modal *before* committing to /start, which is the
// call that actually spends the token. Not authoritative: the real numbers
// always come back from /start itself. Time is driven by how many squares
// are already resolved on THIS board (0 for your first pick, climbing from
// there), not by which artist you picked — see BOARD_PACE_SECONDS in
// server.js for why. A fresh board (new account, or after Try Again) always
// starts back at index 0 since every square goes back to available.
const QUESTIONS_PER_QUIZ_PREVIEW = 7;
const BOARD_PACE_PREVIEW = [18, 16, 14, 12];

function handleBoxClick(artistId, status){
  if (!user) { openAuthModal(); return; }
  if (status !== 'available') return;
  if (currentFestival.board && currentFestival.board.board_over) { toast('This board is over — tap Try Again to start a fresh one.'); return; }
  const cell = (currentFestival.board ? currentFestival.board.cells : currentFestival.artists).find(c => (c.artist_id || c.id) === artistId);
  openConfirmPlayModal(artistId, cell);
}

// A real ticket-stub shape (notched sides, dashed perforation) with the
// count printed directly on it — used wherever a token cost needs to read
// as "a ticket", instead of stapling an emoji next to a number.
function ticketBadgeHTML(n, opts){
  const o = opts || {};
  const w = o.width || 40, h = o.height || 26;
  return `<svg width="${w}" height="${h}" viewBox="0 0 40 26" style="display:block;color:${o.color || 'currentColor'};flex-shrink:0;">
    <path d="M3,4 H37 a3,3 0 0 1 0,6 a2.4,2.4 0 0 0 0,6 a3,3 0 0 1 0,6 H3 a3,3 0 0 1 0,-6 a2.4,2.4 0 0 0 0,-6 a3,3 0 0 1 0,-6 Z"
      fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.4"/>
    <line x1="27" y1="6" x2="27" y2="20" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.2,2.2" opacity="0.55"/>
    <text x="15" y="17.5" font-family="inherit" font-size="12" font-weight="800" text-anchor="middle" fill="currentColor">${n}</text>
  </svg>`;
}

function openConfirmPlayModal(artistId, cell){
  const cellsList = (currentFestival.board && currentFestival.board.cells) || [];
  const resolvedCount = cellsList.filter(c => c.status !== 'available').length;
  const seconds = BOARD_PACE_PREVIEW[Math.min(resolvedCount, BOARD_PACE_PREVIEW.length - 1)];
  const totalSeconds = QUESTIONS_PER_QUIZ_PREVIEW * seconds;
  const mm = Math.floor(totalSeconds / 60), ss = totalSeconds % 60;
  const artistCost = cell?.token_cost ?? 1;
  // A one-time board entry fee (if this festival has one) is only actually
  // owed the very first time this board is played — mirrors the server's
  // own gate on boards.entry_fee_charged in /start.
  const entryFeeCharged = !!(currentFestival.board && currentFestival.board.entry_fee_charged);
  const entryFeeDue = !entryFeeCharged ? (currentFestival.board_entry_fee_tokens || 0) : 0;
  const totalCost = artistCost + entryFeeDue;
  document.getElementById('confirm-play-modal-body').innerHTML = `
    <h3>🎤 ${cell?.name || 'This artist'}</h3>
    <p class="sub">One shot — answer wrong and this square is dead for your board, no retry.</p>
    ${resolvedCount > 0 ? `<p class="sub" style="color:var(--gold);font-weight:700;">⚡ Square ${resolvedCount + 1} on this board — the clock's a bit tighter than your first pick.</p>` : ''}
    ${entryFeeDue ? `<p class="sub" style="color:var(--purple);font-weight:700;">🎪 First square on this board — includes a one-time ${entryFeeDue}-token board entry.</p>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px;margin:16px 0;">
      ${entryFeeDue ? `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);border-radius:8px;">
        <span style="font-size:11.5px;color:var(--txt2);">🎪 Board entry (one-time)</span>
        <span style="color:var(--purple);">${ticketBadgeHTML(entryFeeDue)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);border-radius:8px;">
        <span style="font-size:11.5px;color:var(--txt2);">🎤 This square</span>
        <span style="color:var(--gold);">${ticketBadgeHTML(artistCost)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);border-radius:8px;border:1.5px solid var(--gold);">
        <span style="font-size:11.5px;font-weight:800;">Total</span>
        <span style="color:var(--gold);">${ticketBadgeHTML(totalCost)}</span>
      </div>` : `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);border-radius:8px;">
        <span style="font-size:11.5px;color:var(--txt2);">Cost</span>
        <span style="color:var(--gold);">${ticketBadgeHTML(artistCost)}</span>
      </div>`}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);border-radius:8px;">
        <span style="font-size:11.5px;color:var(--txt2);">❓ Questions</span>
        <span style="font-weight:800;">${QUESTIONS_PER_QUIZ_PREVIEW}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);border-radius:8px;">
        <span style="font-size:11.5px;color:var(--txt2);">⏱️ Time limit</span>
        <span style="font-weight:800;">${mm}:${String(ss).padStart(2,'0')}</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn" style="flex:1;" onclick="closeModal('confirm-play-modal')">CANCEL</button>
      <button class="btn btn-purple" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;" onclick="confirmAndStartQuiz(${artistId})">CONFIRM ${ticketBadgeHTML(totalCost, {width:32, height:21})}</button>
    </div>
  `;
  document.getElementById('confirm-play-modal').classList.add('open');
}

function confirmAndStartQuiz(artistId){
  closeModal('confirm-play-modal');
  fetch(`${API}/api/festivals/${currentFestival.slug}/start`, {
    method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ artist_id: artistId })
  }).then(r => r.json()).then(d => {
    if (d.error) { toast(d.error); return; }
    currentAttempt = {
      id: d.attempt_id, questions: d.questions, artist: d.artist, level: d.level,
      passThreshold: d.pass_threshold, current: 0, results: Array(d.questions.length).fill(null),
      answering: false, feedback: null, timer: null,
      timeLeft: d.questions.length * (d.level?.secondsPerQuestion || 15),
    };
    refreshWallet();
    openQuiz();
    startQuizTimer();
  });
}

function startQuizTimer(){
  clearInterval(currentAttempt.timer);
  currentAttempt.timer = setInterval(() => {
    const a = currentAttempt;
    if (!a) return;
    a.timeLeft -= 1;
    if (a.timeLeft <= 0) {
      a.timeLeft = 0;
      clearInterval(a.timer);
      renderTimer();
      submitQuiz();
      return;
    }
    renderTimer();
  }, 1000);
}

function renderTimer(){
  const el = document.getElementById('qtimer-val');
  if (!el || !currentAttempt) return;
  const t = currentAttempt.timeLeft;
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(t % 60).padStart(2, '0');
  const color = t <= 20 ? 'var(--red)' : t <= 60 ? 'var(--gold)' : 'var(--green)';
  el.style.color = color;
  el.textContent = `${mm}:${ss}`;
  el.style.animation = t <= 15 ? 'tpulse 0.8s infinite' : 'none';
  const box = document.getElementById('qtimer-box');
  if (box) { box.style.background = `${color}15`; box.style.borderColor = `${color}44`; }
  const lbl = document.getElementById('qtimer-lbl');
  if (lbl) lbl.style.color = color;
}

function openQuiz(){
  const d = currentAttempt;
  const body = document.getElementById('quiz-modal-body');
  body.innerHTML = `
    <div class="qmeta">
      <div>
        <div style="font-size:10px;color:var(--txt2);letter-spacing:0.1em;">${d.artist.genre ? d.artist.genre.toUpperCase() : ''} · ${d.artist.name.toUpperCase()} · <span style="opacity:0.7;">GAME #${d.id}</span></div>
        <div style="font-size:11px;color:var(--txt2);margin-top:2px;">Question <span id="qcurrent">1</span> of ${d.questions.length} · need ${d.passThreshold}/${d.questions.length} correct to clear
          ${typeof d.level?.estPassRatePct === 'number' ? ` · 📊 ~${d.level.estPassRatePct}% modeled pass rate — one shot, hard on purpose` : ''}</div>
      </div>
      <div class="qtimer" id="qtimer-box" style="border:1px solid var(--border2);">
        <div class="tlbl" id="qtimer-lbl" style="color:var(--green);">TIME LEFT</div>
        <div class="tval" id="qtimer-val" style="color:var(--green);"></div>
      </div>
    </div>
    <div class="progress-dots" id="qdots"></div>
    <div id="quiz-questions"></div>
    <div style="display:flex;gap:10px;margin-top:6px;justify-content:center;">
      <button class="btn" onclick="submitQuiz()">SUBMIT QUIZ NOW →</button>
    </div>
  `;
  renderTimer();
  renderQuizDots();
  renderCurrentQuestion();
  document.getElementById('quiz-modal').classList.add('open');
}

function renderQuizDots(){
  const el = document.getElementById('qdots');
  if (!el || !currentAttempt) return;
  const a = currentAttempt;
  el.innerHTML = a.results.map((r, i) => {
    const cls = r === 'correct' ? 'correct' : r === 'wrong' ? 'wrong' : i === a.current ? 'current' : '';
    return `<div class="pdot ${cls}"></div>`;
  }).join('');
}

function renderCurrentQuestion(){
  const a = currentAttempt;
  const i = a.current;
  const q = a.questions[i];
  const qEl = document.getElementById('quiz-questions');
  const curEl = document.getElementById('qcurrent');
  if (curEl) curEl.textContent = i + 1;
  qEl.innerHTML = `
    <div class="q-block" id="qblock">
      <div class="q-eyebrow">QUESTION ${i+1} OF ${a.questions.length}</div>
      <div class="q-text">${q.question}</div>
      ${q.choices.map((choice, ci) => `
        <button class="choice" id="choice-${ci}" onclick="answerChoice(${ci})">
          <span class="letter">${String.fromCharCode(65+ci)}</span>${choice}
        </button>
      `).join('')}
    </div>
  `;
}

function answerChoice(choiceIndex){
  const a = currentAttempt;
  if (a.answering || a.feedback) return;
  a.answering = true;
  const qIndex = a.current;
  fetch(`${API}/api/festivals/${currentFestival.slug}/answer`, {
    method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ attempt_id: a.id, question_index: qIndex, choice_index: choiceIndex })
  }).then(r => r.json()).then(d => {
    a.answering = false;
    if (d.error) { toast(d.error); return; }
    a.results[qIndex] = d.correct ? 'correct' : 'wrong';
    a.feedback = { correct: d.correct, chosen: choiceIndex };
    renderQuizDots();

    const block = document.getElementById('qblock');
    if (block) block.classList.add(d.correct ? 'feedback-correct' : 'feedback-wrong');
    document.querySelectorAll('#quiz-questions .choice').forEach((el, ci) => {
      el.disabled = true;
      if (ci === choiceIndex) el.classList.add(d.correct ? 'chosen-correct' : 'chosen-wrong');
      else el.classList.add('dimmed');
    });

    setTimeout(() => {
      a.feedback = null;
      const next = a.current + 1;
      if (next >= a.questions.length) { submitQuiz(); return; }
      a.current = next;
      renderQuizDots();
      renderCurrentQuestion();
    }, 900);
  }).catch(() => { a.answering = false; toast('Network hiccup — tap an answer again.'); });
}

function submitQuiz(){
  const a = currentAttempt;
  if (!a || a.submitting) return;
  a.submitting = true;
  clearInterval(a.timer);
  fetch(`${API}/api/festivals/${currentFestival.slug}/submit`, {
    method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ attempt_id: a.id })
  }).then(r => r.json()).then(d => {
    if (d.error) { toast(d.error); closeModal('quiz-modal'); return; }
    closeModal('quiz-modal');
    if (d.ticket_won) {
      const tierMsg = d.board.lines_completed >= d.board.max_tiers ? ' — max tickets reached, board complete!' : ' — keep going, a 2nd line is still in play!';
      fireConfetti();
      toast(`🎉 LINE COMPLETE! You won: ${d.ticket_won.prize} — claim code ${d.ticket_won.claim_code}${tierMsg}`);
    } else if (d.passed && d.board.lines_completed >= 1 && !d.next_line_reachable) {
      toast(`✅ ${d.artist.name} cleared — but a 2nd line is no longer reachable. Your ticket is locked in either way.`);
    } else if (d.passed) {
      toast(`✅ Correct — ${d.artist.name} cleared! (${d.correct_count}/${d.total})`);
    } else if (d.busted) {
      toast(`💥 ${d.artist.name} not cleared (${d.correct_count}/${d.total}) — and no line is possible anymore. Board over.`);
    } else {
      toast(`❌ ${d.artist.name} is dead for this board (${d.correct_count}/${d.total}, needed ${d.pass_threshold})`);
    }
    renderFestival(currentFestival.slug);
  });
}

// Small celebratory confetti burst — plain DOM/CSS, no canvas or library.
function fireConfetti(){
  const colors = ['#ff3d81','#ff9d00','#ffe066','#00e5a0','#2f9bff','#a230ea'];
  const count = 60;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    const size = 6 + Math.random() * 6;
    el.className = 'confetti-piece';
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.width = size + 'px';
    el.style.height = (size * 0.4) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
}

updateAuthUI();
render();
</script>
</body>
</html>
